<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>Identity Ledger</title><meta name="theme-color" content="#F4F3F9"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Figtree:wght@400;600;700;800&family=Gabarito:wght@700;800&display=swap">
<style>
/* Layout: one 600px column of rounded cards on a soft lavender-white ground; floating pill tab bar (5 tabs).
   The colour comes from the content: each identity wears its own hue, each idea wears its source type's hue.
   Deliberately a single bright theme, so it reads the same on every phone. */
:root{
  --bg:#F4F3F9; --card:#FFFFFF; --field:#F6F5FB; --line:#E6E3EF;
  --ink:#1F1B2D; --ink-2:#5E5972; --ink-3:#9893A8; --on-ink:#FFFFFF;
  --rose:#EC4F5C; --rose-tint:#FDE5E7; --rose-deep:#B32F3B;
  --sun:#FFC22E; --sun-tint:#FFF3D3; --sun-deep:#7F5900;
  --lagoon:#16B3A4; --lagoon-tint:#DDF5F2; --lagoon-deep:#0B7064;
  --grape:#7A5CFF; --grape-tint:#ECE7FF; --grape-deep:#4D33C7;
  --focus:#7A5CFF;
  --scrim:rgba(31,27,45,.38);
  --shadow-card:0 1px 2px rgba(31,27,45,.05), 0 6px 16px -10px rgba(31,27,45,.2);
  --shadow-float:0 10px 24px -12px rgba(31,27,45,.3);
  --f-display:"Gabarito","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --tabs-h:66px;
  color-scheme:light;
}
/* content colours */
.c-tangerine{--c:#FF7A3D;--c-tint:#FFEADF;--c-soft:#FFCDB4;--c-deep:#B4461A;--c-on:#2A1206}
.c-lagoon{--c:#16B3A4;--c-tint:#DCF4F1;--c-soft:#A9E4DD;--c-deep:#0B7064;--c-on:#062925}
.c-grape{--c:#7A5CFF;--c-tint:#ECE7FF;--c-soft:#CEC2FF;--c-deep:#4D33C7;--c-on:#FFFFFF}
.c-sky{--c:#3A8EFF;--c-tint:#E0EDFF;--c-soft:#B3D2FF;--c-deep:#1C5DBF;--c-on:#071D3D}
.c-sunny{--c:#FFC22E;--c-tint:#FFF3D3;--c-soft:#FFE194;--c-deep:#7F5900;--c-on:#2D2100}
.c-lime{--c:#6CC24A;--c-tint:#E6F5DE;--c-soft:#C1E7AD;--c-deep:#3A7C21;--c-on:#11240A}
.c-rose{--c:#EC4F5C;--c-tint:#FDE5E7;--c-soft:#F8BEC3;--c-deep:#B32F3B;--c-on:#FFFFFF}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
html.locked{overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
input,textarea,label,a{touch-action:manipulation}
button:disabled{cursor:default;opacity:.35}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}

/* masthead */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px}
.mark{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em;white-space:nowrap;min-width:0}
.mark svg{flex:none}
.mark span{overflow:hidden;text-overflow:ellipsis}
.top-r{display:flex;align-items:center;gap:6px;flex:none}
.savestate{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink-2);background:var(--card);border-radius:999px;padding:6px 11px;box-shadow:0 0 0 1px var(--line) inset;white-space:nowrap}
.savestate .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.savestate.db .dot{background:var(--lagoon)}
.savestate.local .dot{background:var(--sun)}
.savestate.demo .dot{background:#FF7A3D}
.savestate.busy .dot{background:var(--grape);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (max-width:370px){.savestate .t{display:none}.savestate{padding:8px}}
.iconbtn{width:40px;height:40px;flex:none;display:grid;place-items:center;border:0;background:var(--card);border-radius:50%;color:var(--ink);box-shadow:0 0 0 1px var(--line) inset}

.demobar .wrap{padding-block:0 4px}
.demo-in{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;background:var(--sun-tint);border-radius:18px;padding:10px 10px 10px 16px;font-size:14px;font-weight:600}
.demo-in b{color:var(--sun-deep)}

main.wrap{padding-block:12px calc(var(--tabs-h) + 10px + env(safe-area-inset-bottom,0px) + 30px);display:grid;gap:14px;overflow-x:clip}

/* shared type */
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.pagetitle{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;letter-spacing:-.025em;margin-top:6px}
.lede{color:var(--ink-2);max-width:60ch;text-wrap:pretty;margin-top:-4px}
.big{font-family:var(--f-display);font-weight:800;font-size:58px;line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.big .of{color:var(--ink-3)}
.num{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.link{border:0;background:none;padding:0;color:var(--grape-deep);font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:inherit;text-align:left}
.muted{color:var(--ink-2)}
.note{font-size:14px;color:var(--ink-2)}
.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:var(--shadow-card);display:grid;gap:12px;min-width:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15px;padding:11px 20px;min-height:46px;border:0;background:var(--card);color:var(--ink);border-radius:999px;box-shadow:0 0 0 1.5px var(--line) inset;text-align:center}
.btn.primary{background:var(--ink);color:var(--on-ink);box-shadow:none}
.btn.sm{min-height:38px;padding:7px 15px;font-size:14px}
.btn.danger{color:var(--rose-deep);box-shadow:0 0 0 1.5px var(--rose-tint) inset}
.btn.armed,.btn.armed:hover{background:var(--rose);color:var(--on-ink);box-shadow:none}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* start */
.hero{display:grid;gap:12px;padding-top:6px}
.display{font-family:var(--f-display);font-weight:800;font-size:clamp(38px, 10.5vw, 58px);line-height:1;letter-spacing:-.03em;text-wrap:balance}
.display mark{color:inherit;background:linear-gradient(transparent 56%, var(--sun) 56% 90%, transparent 90%);padding:0 .05em}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{display:grid;grid-template-columns:38px minmax(0,1fr);gap:12px;align-items:start;background:var(--c-tint);border-radius:20px;padding:14px 16px}
.step-n{width:38px;height:38px;border-radius:50%;background:var(--c);color:var(--c-on);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:18px}
.steps b{display:block;font-size:16px}
.steps span{color:var(--ink-2)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;padding:8px 14px;min-height:38px;border:0;background:var(--field);border-radius:999px;color:var(--ink);box-shadow:0 0 0 1px var(--line) inset;text-align:left}
.chip .cd{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.chip[aria-pressed="true"]{background:var(--c, var(--ink));color:var(--c-on, var(--on-ink));box-shadow:none}
.chip[aria-pressed="true"] .cd{background:var(--c-on)}
.chip .ct{font-family:var(--f-mono);font-size:12px;font-weight:400;opacity:.7}
.filters .chip{background:var(--card)}
.filters .chip[aria-pressed="true"]{background:var(--c, var(--ink))}
.tag{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--field);color:var(--ink-2);white-space:nowrap}
.tag.rec{background:var(--lagoon-tint);color:var(--lagoon-deep)}

/* segmented control */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card);border-radius:999px;padding:5px;box-shadow:var(--shadow-card)}
.seg button{border:0;background:none;border-radius:999px;min-height:40px;font-weight:700;font-size:14.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}

/* day nav + hello */
.daynav,.weeknav{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:5px;box-shadow:var(--shadow-card)}
.daynav .iconbtn,.weeknav .iconbtn{background:var(--field);box-shadow:none}
.daynav-t{display:grid;justify-items:center;line-height:1.15}
.d1{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.d2{font-size:12.5px;color:var(--ink-2);font-weight:400}
.hello-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 16px;flex-wrap:wrap}
.hello-top .lbl{margin-top:8px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{width:32px;height:32px;border-radius:50%;border:2px dashed var(--c-soft);display:grid;place-items:center;color:var(--c-on);background:var(--card)}
.pill.on{background:var(--c);border:2px solid var(--c)}
.pill svg{width:16px;height:16px}
.hello-msg{font-weight:700;font-size:16px}
.weekline{display:flex;align-items:center;gap:10px;padding-top:12px;border-top:1px solid var(--line);min-width:0}
.weekline .tallyline{flex:1 1 auto;color:var(--grape)}
.wk-n{font-family:var(--f-display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.tally{display:block;max-width:100%;height:auto}
.tallyline{display:flex;align-items:center;gap:6px;min-width:0;max-width:100%}
.tally-empty{font-size:13px;color:var(--ink-3);font-weight:600}
.tally-more{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}

.alert{background:var(--sun-tint);border-radius:20px;padding:14px 16px;display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 12px;align-items:start}
.alert .ic{grid-row:span 2;width:34px;height:34px;border-radius:50%;background:var(--sun);color:#2D2100;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:19px}
.alert .eyebrow{color:var(--sun-deep)}
.focus{background:var(--card);border-radius:20px;padding:14px 16px;display:grid;grid-template-columns:34px minmax(0,1fr);gap:2px 12px;align-items:center;box-shadow:var(--shadow-card)}
.focus .ic{grid-row:span 2;width:34px;height:34px;border-radius:50%;background:var(--grape-tint);color:var(--grape-deep);display:grid;place-items:center}
.focus p{font-weight:700}

/* identity card on Today */
.trait{position:relative;background:var(--c-tint);border-radius:26px;padding:18px 14px 14px;display:grid;gap:12px}
.who{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--c-deep);padding-right:72px;padding-left:4px}
.statement{margin-top:-8px;font-family:var(--f-display);font-weight:800;font-size:clamp(28px, 8vw, 38px);line-height:1.02;letter-spacing:-.025em;text-wrap:balance;overflow-wrap:anywhere;padding-right:72px;padding-left:4px}
.statement.md{font-size:clamp(26px, 7.4vw, 34px)}
.sticker{position:absolute;top:14px;right:14px;width:60px;height:60px;border-radius:50%;background:var(--c);color:var(--c-on);display:grid;place-content:center;justify-items:center;transform:rotate(9deg);line-height:1;box-shadow:0 8px 16px -8px var(--c)}
.sticker b{font-family:var(--f-display);font-weight:800;font-size:21px;font-variant-numeric:tabular-nums}
.sticker span{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.beh{display:grid;gap:10px;background:var(--card);border-radius:20px;padding:14px}
.beh-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.beh-n{font-weight:800;font-size:16px}
.beh-s{font-size:12.5px;font-weight:700;color:var(--ink-3);white-space:nowrap}
.beh-s.full,.beh-s.min{color:var(--c-deep)}
.beh-s.miss{color:var(--rose-deep)}
.votes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vote{position:relative;display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start;text-align:left;padding:12px;min-height:72px;border:0;background:var(--field);border-radius:16px;box-shadow:0 0 0 1.5px var(--line) inset;transition:background-color .15s,box-shadow .15s,transform .1s}
.vote:active{transform:scale(.98)}
.box{width:24px;height:24px;border-radius:50%;box-shadow:0 0 0 2px var(--c-soft) inset;background:var(--card);display:grid;place-items:center;color:transparent}
.box svg{width:15px;height:15px}
.vote[aria-pressed="true"]{background:var(--c);box-shadow:none;color:var(--c-on)}
.vote[aria-pressed="true"] .box{box-shadow:none;color:var(--c-deep)}
.vote[aria-pressed="true"] .vote-k{color:var(--c-on);opacity:.75}
.vote-t{display:grid;gap:2px;min-width:0}
.vote-k{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.vote-d{font-size:14.5px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.vote.pop{animation:pop .42s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.93)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.beh-f{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.missbtn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;padding:8px 14px;min-height:38px;border:0;background:var(--field);border-radius:999px;color:var(--ink-2);box-shadow:0 0 0 1px var(--line) inset}
.missbtn.on{background:var(--rose-tint);color:var(--rose-deep);box-shadow:none}
.plan{font-size:13.5px;color:var(--ink-2);line-height:1.65;overflow-wrap:anywhere}
.kw{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:1px 8px;border-radius:999px;vertical-align:1px;line-height:1.6}
.kw.if{background:var(--sun-tint);color:var(--sun-deep)}
.kw.then{background:var(--lagoon-tint);color:var(--lagoon-deep)}
.hint{font-size:13.5px;color:var(--ink-2)}

/* 7-day dots */
.strip{display:flex;gap:3px}
.cell{display:grid;justify-items:center;gap:4px;border:0;background:none;padding:2px;width:26px}
.cl{font-size:10.5px;font-weight:800;color:var(--ink-3);line-height:1}
.sq{width:18px;height:18px;border-radius:50%;background:var(--field);box-shadow:0 0 0 1.5px var(--line) inset}
.cell.full .sq{background:var(--c);box-shadow:none}
.cell.min .sq{background:radial-gradient(circle,var(--c) 0 3.6px,var(--c-soft) 4.2px);box-shadow:none}
.cell.miss .sq{background:linear-gradient(45deg,transparent 43%,var(--rose) 43% 57%,transparent 57%),linear-gradient(-45deg,transparent 43%,var(--rose) 43% 57%,transparent 57%),var(--rose-tint);box-shadow:none}
.cell.pre .sq{background:transparent;opacity:.6}
.cell.cur .cl{color:var(--ink)}
.cell.cur .sq{outline:2px solid var(--ink);outline-offset:2px}

/* vote burst */
.burst{position:absolute;width:0;height:0;pointer-events:none;z-index:3}
.burst i{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:2px;background:var(--k);animation:fly .85s cubic-bezier(.12,.75,.3,1) forwards}
.burst i.r{border-radius:50%}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.5);opacity:0}}
.plus{position:absolute;left:0;top:0;white-space:nowrap;font-family:var(--f-display);font-weight:800;font-size:16px;color:var(--c-deep);background:var(--card);border-radius:999px;padding:4px 12px;box-shadow:var(--shadow-float);animation:rise 1.05s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}22%{opacity:1;transform:translate(-50%,-120%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-190%)}}

/* identity tab */
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.idcard{background:var(--card);border-radius:26px;overflow:hidden;box-shadow:var(--shadow-card)}
.idtop{position:relative;background:var(--c-tint);padding:18px 14px 16px;display:grid;gap:8px}
.idtop .why{padding-left:4px;padding-right:72px;color:var(--ink-2)}
.idbody{padding:16px;display:grid;gap:14px}
.behs{margin:0;display:grid;gap:8px}
.bdef{display:grid;gap:2px;padding:10px 14px;background:var(--field);border-radius:16px;min-width:0}
.bdef dt{font-weight:800}
.bdef dd{margin:0;font-size:14px;color:var(--ink-2);overflow-wrap:anywhere}
.bdef .k{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--c-deep);display:inline-block;width:3.6em}
.idstats{display:flex;align-items:flex-end;gap:12px 24px;flex-wrap:wrap}
.idstats .lbl{margin-top:4px}
.tallywrap{flex:1 1 150px;min-width:0;padding-bottom:4px;color:var(--c)}
.archrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:10px;border-top:1px solid var(--line)}
.archrow span{min-width:0;overflow-wrap:anywhere;display:flex;gap:8px;align-items:center}
.cdot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;display:inline-block}
.mini{display:grid;gap:8px}
.miniidea{background:var(--field);border-radius:16px;padding:10px 14px;display:grid;gap:3px}
.miniidea p{font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.miniidea span{font-size:12.5px;color:var(--ink-2);overflow-wrap:anywhere}

/* notes */
.composer{background:var(--c-tint);box-shadow:none}
.composer .eyebrow{color:var(--c-deep)}
.prompt{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.25;letter-spacing:-.01em;text-wrap:balance}
.composer textarea{background:var(--card);min-height:112px}
.composer .link{color:var(--c-deep)}
.notelist,.idealist{display:grid;gap:10px}
.notelist > .eyebrow{margin-top:4px}
.ncard{display:grid;gap:6px;text-align:left;border:0;background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow-card);width:100%}
.ncard.pinned{background:var(--sun-tint)}
.ncard-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ncard-t{white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden}
.pinmark{font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--sun-deep);display:inline-flex;align-items:center;gap:4px}
.search{position:relative}
.search input{padding-left:42px;border-radius:999px;background:var(--card);-webkit-appearance:none;appearance:none}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}

/* ideas */
.idea{background:var(--card);border-radius:24px;padding:16px 18px 14px;box-shadow:var(--shadow-card);display:grid;gap:10px;min-width:0}
.idea-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.qmark{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:.75;height:30px;color:var(--c);display:block}
.star{width:38px;height:38px;flex:none;border-radius:50%;border:0;background:var(--field);display:grid;place-items:center;color:var(--ink-3)}
.star path{fill:none}
.star[aria-pressed="true"]{background:var(--sun-tint);color:#D99A00}
.star[aria-pressed="true"] path{fill:currentColor}
.idea-text{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.25;letter-spacing:-.01em;overflow-wrap:anywhere;text-wrap:pretty}
.src{display:flex;align-items:center;gap:10px;min-width:0}
.srcic{width:34px;height:34px;border-radius:50%;background:var(--c-tint);color:var(--c-deep);display:grid;place-items:center;flex:none}
.src-t{display:grid;line-height:1.3;min-width:0;font-size:14px}
.src-t b{overflow-wrap:anywhere}
.src-t span{color:var(--ink-2);font-size:13px;overflow-wrap:anywhere}
.take{background:var(--field);border-radius:16px;padding:10px 14px;display:grid;gap:2px}
.take p{font-size:14.5px;overflow-wrap:anywhere;white-space:pre-wrap}
.idea-f{display:flex;justify-content:space-between;align-items:center;gap:8px}
.idchips{display:flex;flex-wrap:wrap;gap:6px;min-width:0;flex:1 1 auto}
.idchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 10px 4px 8px;border-radius:999px;background:var(--c-tint);color:var(--c-deep);overflow-wrap:anywhere}
.ideaday{background:var(--card);border-radius:24px;padding:16px 18px;display:grid;gap:10px;box-shadow:var(--shadow-card)}
.ideaday .eyebrow{display:inline-flex;align-items:center;gap:6px;color:var(--c-deep)}
.ideaday .idea-text{font-size:19px}
.empty-ideas{background:var(--c-tint);box-shadow:none}
.headline{font-size:17px;font-weight:700;line-height:1.4;text-wrap:pretty;max-width:52ch}
.fromnote{margin:0;padding:12px 14px;background:var(--sun-tint);border-radius:16px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:9.5em;overflow:auto}

/* misses + bars */
.grp{display:grid;gap:8px}
.bars{display:grid;gap:9px}
.barrow{display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr) 2.6em;gap:10px;align-items:center;font-size:14px}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.track{height:12px;background:var(--field);border-radius:999px;overflow:hidden;display:flex}
.track.tall{height:18px}
.fill{height:100%;background:var(--c);border-radius:999px}
.seg-full{height:100%;background:var(--c)}
.seg-min{height:100%;background:var(--c-soft)}
.seg-miss{height:100%;background:var(--rose)}
.bn{font-family:var(--f-mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--ink-2);font-weight:600}
.lg{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.sw{width:12px;height:12px;border-radius:4px;display:inline-block;background:var(--field);box-shadow:0 0 0 1px var(--line) inset}
.sw.full{background:var(--c);box-shadow:none}
.sw.min{background:var(--c-soft);box-shadow:none}
.sw.miss{background:var(--rose);box-shadow:none}
.bigrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.missitem{background:var(--card);border-radius:20px;padding:14px 16px;display:grid;gap:8px;box-shadow:var(--shadow-card)}
.mi-h{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap}
.mi-date{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2)}
.mi-b{font-weight:800;display:inline-flex;align-items:center;gap:7px}
.story{font-style:italic;overflow-wrap:anywhere}
.planlist{display:grid;margin:0;padding:0;list-style:none}
.planlist li{padding-block:10px;border-top:1px solid var(--line);display:grid;gap:2px}
.planlist li:first-child{border-top:0;padding-top:0}
.planlist .plan{color:var(--ink);font-size:14.5px}
.misslist{display:grid;gap:10px}

/* review */
.review-form{gap:14px}
.pastrev{display:grid}
.pastrev button{display:grid;gap:2px;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:12px 0}
.pastrev button:first-child{border-top:0;padding-top:0}

/* forms */
.field{display:grid;gap:7px;min-width:0}
.flabel{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:0;box-shadow:0 0 0 1.5px var(--line) inset;border-radius:14px;padding:12px 14px}
textarea{resize:vertical;min-height:78px;line-height:1.45}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
input:focus,textarea:focus{outline:none;background:var(--card);box-shadow:0 0 0 2px var(--focus) inset}
.fhelp{font-size:13.5px;color:var(--ink-2)}
.err{color:var(--rose-deep);font-weight:700;font-size:14px}
fieldset.bedit{border:0;background:var(--field);border-radius:20px;padding:14px;margin:0;display:grid;gap:10px;min-width:0}
fieldset.bedit input{background:var(--card)}
legend{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);padding:0;margin-bottom:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ifthen{display:grid;grid-template-columns:3.6em minmax(0,1fr);gap:8px;align-items:center}
.ifthen .kw{justify-self:start;font-size:11px;padding:3px 10px}
.swatches{display:flex;gap:12px;flex-wrap:wrap;padding:4px 2px}
.swatch{width:38px;height:38px;border-radius:50%;border:0;background:var(--c)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--card),0 0 0 5.5px var(--c)}
@media (max-width:430px){.two{grid-template-columns:1fr}}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:40}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .18s ease both}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;width:min(600px,100%);max-height:calc(100% - 28px - env(safe-area-inset-top,0px));overflow:auto;overscroll-behavior:contain;background:var(--card);border-radius:28px 28px 0 0;box-shadow:var(--shadow-float);animation:up .28s cubic-bezier(.2,.9,.3,1) both}
.sheet:focus{outline:none}
.sheet .wrap{padding-block:10px calc(26px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}
.sheet .iconbtn{background:var(--field);box-shadow:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.sh-t{font-family:var(--f-display);font-weight:800;font-size:27px;letter-spacing:-.02em;line-height:1.1}
.sh-sub{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink-2);margin-top:4px}
.sh-note{padding:12px 14px;background:var(--lagoon-tint);border-radius:16px;font-size:14px}
.setsec{display:grid;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.setsec p{font-size:14px;color:var(--ink-2)}
@keyframes up{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}

/* floating tabs */
.tabs{position:fixed;z-index:20;left:max(12px, env(safe-area-inset-left,0px));right:max(12px, env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:540px;will-change:transform;background:var(--card);border-radius:26px;box-shadow:var(--shadow-float),0 0 0 1px var(--line) inset;padding:6px}
.tabrow{display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--tabs-h) - 12px)}
.tab{display:grid;justify-items:center;align-content:center;gap:2px;border:0;background:none;border-radius:20px;color:var(--ink-3);font-size:12px;font-weight:700;min-width:0}
.tab .ti{width:44px;height:28px;border-radius:999px;display:grid;place-items:center;transition:background-color .2s,color .2s}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .ti{background:var(--t-tint);color:var(--t-deep)}
.tab[data-tab="today"]{--t-tint:#FFEADF;--t-deep:#B4461A}
.tab[data-tab="identity"]{--t-tint:#ECE7FF;--t-deep:#4D33C7}
.tab[data-tab="notes"]{--t-tint:#FFF3D3;--t-deep:#7F5900}
.tab[data-tab="ideas"]{--t-tint:#E0EDFF;--t-deep:#1C5DBF}
.tab[data-tab="review"]{--t-tint:#DCF4F1;--t-deep:#0B7064}

.toast{position:fixed;z-index:60;left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100% - 32px);bottom:calc(var(--tabs-h) + 10px + env(safe-area-inset-bottom,0px) + 12px);background:var(--ink);color:var(--on-ink);font-size:14px;font-weight:600;padding:10px 16px;border-radius:999px;box-shadow:var(--shadow-float);animation:up .2s ease both}

/* speed + feel */
.contents{display:contents}
.morewrap{display:flex;justify-content:center;padding-top:4px}
.ncard{content-visibility:auto;contain-intrinsic-size:auto 110px}
.idea{content-visibility:auto;contain-intrinsic-size:auto 220px}
.missitem{content-visibility:auto;contain-intrinsic-size:auto 170px}
.btn,.chip,.iconbtn,.missbtn,.star,.ncard,.swatch,.seg button{transition:transform .12s ease,background-color .15s ease,box-shadow .15s ease,color .15s ease}
.btn:active:not(:disabled),.chip:active,.iconbtn:active:not(:disabled),.missbtn:active,.star:active,.swatch:active,.seg button:active{transform:scale(.95)}
.ncard:active{transform:scale(.985)}
.tab .ti{transition:background-color .2s ease,color .2s ease,transform .12s ease}
.tab:active .ti{transform:scale(.88)}
.cell .sq{transition:transform .12s ease}
.cell:active .sq{transform:scale(.8)}
@media (hover:hover){
  .iconbtn:hover:not(:disabled){background:var(--field)}
  .btn:hover:not(:disabled){background:var(--field)}
  .btn.primary:hover:not(:disabled){background:#2E2942}
  .btn.armed:hover{background:var(--rose)}
  .chip:hover{box-shadow:0 0 0 1.5px var(--ink-3) inset}
  .chip[aria-pressed="true"]:hover{box-shadow:none}
  .vote:hover{box-shadow:0 0 0 1.5px var(--c-soft) inset}
  .vote[aria-pressed="true"]:hover{box-shadow:none}
  .missbtn:hover{color:var(--rose-deep)}
  .ncard:hover{box-shadow:var(--shadow-card),0 0 0 1.5px var(--line) inset}
}
main.enter{animation:viewIn .18s ease-out}
@keyframes viewIn{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.sheet-wrap.closing{pointer-events:none}
.sheet-wrap.closing .scrim{animation:fadeOut .19s ease forwards}
.sheet-wrap.closing .sheet{animation:down .19s ease-in forwards}
@keyframes fadeOut{to{opacity:0}}
@keyframes down{to{transform:translateY(40px);opacity:0}}
.skel{display:block;max-width:100%;background:linear-gradient(90deg,var(--field) 0%,var(--line) 50%,var(--field) 100%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
.skel-card{background:var(--card);box-shadow:var(--shadow-card)}
.skel-mid{display:grid;justify-items:center;gap:6px}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}
}

/* ---------- helpers ---------- */

function pad(n){ return (n < 10 ? '0' : '') + n; }

function fmtShort(s){ return parse(s).toLocaleDateString('en-GB',{day:'numeric', month:'short'}); }

}
function pct(n, d){ return d ? Math.round(n/d*100) + '%' : '—'; }

/* ---------- state ---------- */
function emptyFor(k){
  if (k === 'traits') return {traits:[]};
  if (k === 'reviews') return {weeks:{}};
  if (k === 'notes') return {notes:[]};
  if (k === 'ideas') return {ideas:[]};
  return {days:{}, misses:[]};
}
function fixDoc(k, v){
  if (k === 'traits'){
    if (!Array.isArray(v.traits)) v.traits = [];
    v.traits = v.traits.filter(function(t){ return t && t.id && Array.isArray(t.behaviors); });
  } else if (k === 'reviews'){
    if (!v.weeks || typeof v.weeks !== 'object') v.weeks = {};
  } else if (k === 'notes'){
    if (!Array.isArray(v.notes)) v.notes = [];
    v.notes = v.notes.filter(function(n){ return n && n.id && typeof n.text === 'string'; });
  } else if (k === 'ideas'){
    if (!Array.isArray(v.ideas)) v.ideas = [];
    v.ideas = v.ideas.filter(function(x){ return x && x.id && typeof x.text === 'string'; });
    v.ideas.forEach(function(x){ if (!Array.isArray(x.identityIds)) x.identityIds = []; if (!TYPES[x.type]) x.type = 'other'; });
  } else {
    if (!v.days || typeof v.days !== 'object') v.days = {};
    if (!Array.isArray(v.misses)) v.misses = [];
  }
  return v;
}
function normalize(docs){
  var out = {};
  Object.keys(docs || {}).forEach(function(k){
    var v = docs[k];
    if (KEY_RE.test(k) && v && typeof v === 'object') out[k] = fixDoc(k, clone(v));
  });
  ['traits','reviews','notes','ideas'].forEach(function(k){ if (!out[k]) out[k] = emptyFor(k); });
  return out;
}
function docHasData(k, v){
  if (!v) return false;
  if (k === 'traits') return v.traits && v.traits.length > 0;
  if (k === 'reviews') return v.weeks && Object.keys(v.weeks).length > 0;
  if (k === 'notes') return v.notes && v.notes.length > 0;
  if (k === 'ideas') return v.ideas && v.ideas.length > 0;
  return (v.days && Object.keys(v.days).length > 0) || (v.misses && v.misses.length > 0);
}

  reviewSeg: 'week',
  drafts: {},

  ideaFilter: {kind:'all', value:''},
  ideaQuery: '',
  ideaOffset: 0,
  scroll: {},

/* cached totals: rebuilt only when data changes, not on every render */
var dataVer = 0, idxVer = -1, idxCache = null;
function bump(){ dataVer++; }
function idx(){
  if (idxCache && idxVer === dataVer) return idxCache;
  var votes = {}, misses = [], plan = {};
  monthKeys().forEach(function(k){
    var md = S.docs[k], days = md.days || {};
    Object.keys(days).forEach(function(d){
      var day = days[d];
      Object.keys(day).forEach(function(bid){ if (day[bid] === 'min' || day[bid] === 'full') votes[bid] = (votes[bid] || 0) + 1; });
    });
    (md.misses || []).forEach(function(x){ misses.push(x); });
  });
  misses.sort(function(a,b){ return b.date.localeCompare(a.date) || String(b.createdAt || '').localeCompare(String(a.createdAt || '')); });
  misses.forEach(function(m){ if (!plan[m.behaviorId] && m.ifThen && m.ifThen.if && m.ifThen.then) plan[m.behaviorId] = m.ifThen; });
  idxCache = {votes:votes, misses:misses, plan:plan}; idxVer = dataVer;
  return idxCache;
}
function reducedMotion(){ return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }

function realDocs(){ return S.demo ? S.real : S.docs; }
function traits(){ return (S.docs.traits && S.docs.traits.traits) || []; }
function activeTraits(){ return traits().filter(function(t){ return !t.archived; }); }
function traitMap(){ var m = {}; traits().forEach(function(t){ m[t.id] = t; }); return m; }
function notes(){ return (S.docs.notes && S.docs.notes.notes) || []; }
function ideas(){ return (S.docs.ideas && S.docs.ideas.ideas) || []; }
function colorOf(t){
  if (t && COLOR_KEYS.indexOf(t.color) >= 0) return t.color;
  var i = traits().indexOf(t);
  return COLOR_KEYS[(i < 0 ? 0 : i) % COLOR_KEYS.length];
}
function nextColor(){
  var used = activeTraits().map(colorOf);
  for (var i = 0; i < COLOR_KEYS.length; i++) if (used.indexOf(COLOR_KEYS[i]) < 0) return COLOR_KEYS[i];
  return COLOR_KEYS[0];
}
function bmap(){
  var m = {};
  traits().forEach(function(t){ t.behaviors.forEach(function(b){ m[b.id] = {t:t, b:b}; }); });
  return m;
}
function month(key){
  if (!S.docs[key]) S.docs[key] = emptyFor(key);
  return fixDoc(key, S.docs[key]);
}
function getStatus(date, bid){
  var m = S.docs[monthKey(date)];
  return (m && m.days && m.days[date] && m.days[date][bid]) || null;
}
function setStatus(date, bid, val){
  var key = monthKey(date), m = month(key);
  var prev = getStatus(date, bid);
  var day = m.days[date] || (m.days[date] = {});
  if (val) day[bid] = val; else delete day[bid];
  if (!Object.keys(day).length) delete m.days[date];
  var fresh = idxCache && idxVer === dataVer;
  save(key);
  /* a vote only changes one counter, so update it instead of recounting everything */
  if (fresh){
    var was = prev === 'min' || prev === 'full', now = val === 'min' || val === 'full';
    if (was !== now) idxCache.votes[bid] = (idxCache.votes[bid] || 0) + (now ? 1 : -1);
    idxVer = dataVer;
  }
}
function monthKeys(){ return Object.keys(S.docs).filter(function(k){ return k.indexOf('m-') === 0; }); }
function allMisses(){ return idx().misses; }
function findMiss(date, bid){
  var m = S.docs[monthKey(date)];
  if (!m || !m.misses) return null;
  for (var i = 0; i < m.misses.length; i++){ if (m.misses[i].date === date && m.misses[i].behaviorId === bid) return m.misses[i]; }
  return null;
}
function latestPlan(bid){ return idx().plan[bid] || null; }
function ensureCreated(bid, day){
  var info = bmap()[bid];
  if (info && day < info.t.createdAt){ info.t.createdAt = day; save('traits'); }
}
function stats(bid, from, to, created){
  var today = todayStr();
  var s = from < created ? created : from;
  var e = to > today ? today : to;
  var r = {full:0, min:0, miss:0, blank:0, possible:0};
  for (var d = s; d <= e; d = addDays(d, 1)){
    r.possible++;
    var st = getStatus(d, bid);
    if (st) r[st]++; else r.blank++;
  }
  return r;
}
function countVotes(from, to, list){
  var n = 0;
  for (var d = from; d <= to; d = addDays(d, 1)){
    list.forEach(function(t){ t.behaviors.forEach(function(b){ var st = getStatus(d, b.id); if (st === 'min' || st === 'full') n++; }); });
  }
  return n;
}
function totalVotes(t){ var v = idx().votes, n = 0; t.behaviors.forEach(function(b){ n += v[b.id] || 0; }); return n; }
function countBy(list, fn){
  var m = {};
  list.forEach(function(x){ [].concat(fn(x) || []).forEach(function(k){ if (k) m[k] = (m[k] || 0) + 1; }); });
  return Object.keys(m).map(function(k){ return [k, m[k]]; }).sort(function(a,b){ return b[1]-a[1]; });
}
function statusText(st){ return st === 'full' ? 'Full vote' : st === 'min' ? 'Minimum vote' : st === 'miss' ? 'Missed' : ''; }

/* ---------- storage ---------- */
function lsRead(){ try { var r = localStorage.getItem(LS_KEY); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
function lsWrite(){ try { localStorage.setItem(LS_KEY, JSON.stringify(realDocs())); } catch(e){} }
var lsTimer = 0, draftTimer = 0;
function lsWriteSoon(){ clearTimeout(lsTimer); lsTimer = setTimeout(function(){ lsTimer = 0; lsWrite(); }, 400); }
function draftRead(){ try { return localStorage.getItem(LS_DRAFT) || ''; } catch(e){ return ''; } }
function draftWrite(v){ try { if (v) localStorage.setItem(LS_DRAFT, v); else localStorage.removeItem(LS_DRAFT); } catch(e){} }
function draftWriteSoon(v){ clearTimeout(draftTimer); draftTimer = setTimeout(function(){ draftTimer = 0; draftWrite(v); }, 400); }
/* when the app is hidden or closed, save anything still waiting */
function flushAll(){
  if (lsTimer){ clearTimeout(lsTimer); lsTimer = 0; lsWrite(); }
  if (draftTimer){ clearTimeout(draftTimer); draftTimer = 0; if (!S.demo) draftWrite(S.noteDraft); }
  Object.keys(DB.q).forEach(function(id){ var q = DB.q[id]; if (q.timer){ clearTimeout(q.timer); q.timer = 0; flush(id); } });
}

function save(id){
  bump();
  if (S.demo) return;
  persist(id);
}
function persist(id){
  lsWriteSoon();
  if (S.backend === 'connecting'){ S.preDb[id] = 1; return; }
  if (S.backend !== 'db') return;
  var q = DB.q[id] || (DB.q[id] = {dirty:false, inflight:false, timer:0, failed:false});
  q.dirty = true;
  clearTimeout(q.timer);
  q.timer = setTimeout(function(){ q.timer = 0; flush(id); }, 350);
  setStatusChip();
}
function writeDoc(id, body){
  return DB.col.doc(id).set(body).catch(function(e){
    if (e && e.code === 'unavailable'){
      return new Promise(function(r){ setTimeout(r, 500 + Math.random()*700); }).then(function(){ return DB.col.doc(id).set(body); });
    }
    throw e;
  });
}
function flush(id){
  var q = DB.q[id];
  if (!q || q.inflight || S.backend !== 'db') return;
  q.inflight = true;
  setStatusChip();
  (function loop(){
    if (!q.dirty){ q.inflight = false; q.failed = false; setStatusChip(); return; }
    q.dirty = false;
    var src = realDocs();
    var body = clone(src[id] || emptyFor(id));
    if (JSON.stringify(body).length > 240000){
      q.inflight = false; q.failed = true; setStatusChip();
      toast((id === 'notes' ? 'Your notes are' : id === 'ideas' ? 'Your ideas are' : 'This month is') + ' too big to save to your account. Copy a backup, then delete some old entries.');
      return;
    }
    writeDoc(id, body).then(loop, function(e){
      q.inflight = false; q.failed = true;
      handleWriteError(e);
      setStatusChip();
    });
  })();
}
function handleWriteError(e){
  var code = e && e.code;

    toast('Your storage is full. Copy a backup from Settings, then erase old data.');
  } else if (code === 'unavailable' || code === 'resource_exhausted'){
    toast('Couldn’t reach your account. The change is kept here and saves with your next change.');
  } else {
    S.backend = 'local';
    toast('Couldn’t save to your account. Saving on this device instead.');
  }
}
function readSnap(snap){
  var out = {};
  snap.docs.forEach(function(d){
    if (d.exists && KEY_RE.test(d.id)){ var v = d.data(); if (v) out[d.id] = fixDoc(d.id, clone(v)); }
  });
  return out;
}
function busyDoc(k){ var q = DB.q[k]; return !!(q && (q.dirty || q.inflight || q.timer || q.failed)); }
function applyServer(server){
  var local = realDocs(), changed = false;
  Object.keys(server).forEach(function(k){
    if (busyDoc(k)) return;
    if (JSON.stringify(local[k]) !== JSON.stringify(server[k])){ local[k] = server[k]; changed = true; }
  });
  if (changed){ bump(); lsWriteSoon(); if (!S.demo) requestRender(); }
}
function goLocal(){ S.backend = 'local'; setStatusChip(); if (S.skel) render(); }
function connect(){
  var c = window.claude;
  if (!c || typeof c.use !== 'function'){ goLocal(); return; }
  Promise.all([c.use('db'), c.use('user')]).then(function(r){
    var db = r[0], user = r[1];
    if (!db || !user){ goLocal(); return; }
    return user.id().then(function(id){
      if (!id){ goLocal(); return; }
      try { DB.col = db.collection('data/users/' + id); } catch(e){ goLocal(); return; }
      var settled = false;
      DB.col.onSnapshot(function(snap){
        if (!settled){
          if (snap.metadata && snap.metadata.fromCache) return;
          settled = true;
          S.backend = 'db';
          var server = readSnap(snap);
          var local = realDocs();
          var push = {};
          Object.keys(S.preDb).forEach(function(k){ push[k] = 1; });
          Object.keys(local).forEach(function(k){ if (!(k in server) && docHasData(k, local[k])) push[k] = 1; });
          Object.keys(server).forEach(function(k){ if (!push[k]) local[k] = server[k]; });
          ['traits','reviews','notes','ideas'].forEach(function(k){ if (!local[k]) local[k] = emptyFor(k); });
          S.preDb = {};
          bump(); lsWriteSoon();
          Object.keys(push).forEach(function(k){ persist(k); });
          setStatusChip();
          if (!S.demo) requestRender();
          return;
        }
        applyServer(readSnap(snap));
      }, function(){
        goLocal();
        toast('Lost the connection to your account. Saving on this device for now.');
      });
    });
  }).catch(function(){ goLocal(); });
}

/* ---------- chrome ---------- */
function setStatusChip(){
  var el = $('#saveState'); if (!el) return;
  var cls, txt;
  if (S.demo){ cls = 'demo'; txt = 'Example'; }
  else if (S.backend === 'db'){
    var busy = Object.keys(DB.q).some(function(k){ var q = DB.q[k]; return q.dirty || q.inflight || q.timer; });
    cls = busy ? 'busy' : 'db'; txt = busy ? 'Saving' : 'Saved';
  } else if (S.backend === 'connecting'){ cls = 'busy'; txt = 'Connecting'; }

  el.querySelector('.t').textContent = txt;
}
var toastTimer = 0;

  var t = $('#toast');
  t.textContent = msg; t.hidden = false;
  t.style.animation = 'none'; void t.offsetWidth; t.style.animation = '';

}
/* background updates are batched into one redraw per frame */

    var a = document.activeElement;

    render();
  });
}

var view = $('#view');

function tally(n, cap){
  var shown = Math.min(n, cap);
  if (!shown) return '<span class="tally-empty">No votes yet</span>';
  var groups = Math.ceil(shown/5), gw = 25, w = groups*gw, p = '';
  for (var g = 0; g < groups; g++){
    var k = Math.min(5, shown - g*5), x0 = g*gw + 3;
    for (var i = 0; i < Math.min(k, 4); i++){
      var x = x0 + i*4.6 + (((i*7 + g*3) % 3) - 1)*0.35;
      var y1 = 3 + ((i + g) % 2)*0.9, y2 = 19.5 - ((i + 2*g) % 3)*0.7;
      p += 'M' + x.toFixed(2) + ' ' + y1.toFixed(2) + 'L' + (x + 0.3).toFixed(2) + ' ' + y2.toFixed(2);
    }
    if (k === 5) p += 'M' + (x0 - 2.5) + ' 16.5L' + (x0 + 17) + ' 5';
  }
  return '<span class="tallyline"><svg class="tally" viewBox="0 0 ' + w + ' 22" width="' + w + '" height="22" role="img" aria-label="' + n + ' votes"><path d="' + p + '" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>' +
    (n > cap ? '<span class="tally-more">+' + (n - cap) + '</span>' : '') + '</span>';
}

}

  }).join('');
}
function moreBtn(list, left){

}

function dayNav(day, today){

  } else {

    if (time[0]) parts.push(time[0][1] + ' of your ' + ms.length + ' misses happened ' + TIME_PHRASE[time[0][0]] + '.');

        (tags.length ? '<div class="chips">' + tags.map(function(x){ return '<span class="tag">' + esc(x) + '</span>'; }).join('') + '</div>' : '') +
        (m.story ? '<p class="story">“' + esc(m.story) + '”</p>' : '') +

    return t.behaviors.some(function(b){ for (var d = ws; d <= we; d = addDays(d, 1)) if (getStatus(d, b.id)) return true; return false; });
  });
  var rows = [], tot = {full:0, min:0, miss:0, blank:0, possible:0};
  list.forEach(function(t){ t.behaviors.forEach(function(b){
    var s = stats(b.id, ws, we, t.createdAt);
    rows.push({t:t, b:b, s:s});
    ['full','min','miss','blank','possible'].forEach(function(k){ tot[k] += s[k]; });
  }); });

  var html = '<p class="lede">Once a week, look at the whole picture instead of judging single days.</p>';
  html += '<div class="weeknav">' +
    '<button class="iconbtn" data-act="week" data-week="' + addDays(ws, -7) + '" aria-label="Previous week">' + ICON_L + '</button>' +
    '<div class="daynav-t"><span class="d1">' + (ws === curWs ? 'This week' : ws === addDays(curWs, -7) ? 'Last week' : 'Week of ' + esc(fmtShort(ws))) + '</span><span class="d2">' + esc(fmtShort(ws)) + ' – ' + esc(fmtShort(we)) + '</span></div>' +
    '<button class="iconbtn" data-act="week" data-week="' + addDays(ws, 7) + '" ' + (ws >= curWs ? 'disabled' : '') + ' aria-label="Next week">' + ICON_R + '</button>' +
  '</div>';

  if (!rows.length){
    html += '<section class="card"><p class="muted">Add an identity first. Your weekly numbers show up here.</p></section>';
  } else {
    html += '<section class="card"><div class="eyebrow">Votes this week</div>' +
      '<div class="bigrow"><span class="big">' + (tot.full + tot.min) + '</span><span class="lbl">of ' + tot.possible + ' possible · ' + pct(tot.full + tot.min, tot.possible) + '</span></div>' +
      '<div class="legend c-' + colorOf(rows[0].t) + '"><span class="lg"><span class="sw full"></span>Full ' + tot.full + '</span><span class="lg"><span class="sw min"></span>Minimum ' + tot.min + '</span><span class="lg"><span class="sw miss"></span>Missed ' + tot.miss + '</span><span class="lg"><span class="sw"></span>Not logged ' + tot.blank + '</span></div>' +
      '<div class="bars">' + rows.map(function(r){
        var s = r.s, P = s.possible || 1;
        return '<div class="barrow c-' + colorOf(r.t) + '"><span class="bl">' + esc(r.b.name) + '</span><span class="track tall">' +
          '<span class="seg-full" style="width:' + (s.full/P*100).toFixed(1) + '%"></span>' +
          '<span class="seg-min" style="width:' + (s.min/P*100).toFixed(1) + '%"></span>' +
          '<span class="seg-miss" style="width:' + (s.miss/P*100).toFixed(1) + '%"></span>' +
        '</span><span class="bn">' + pct(s.full + s.min, s.possible) + '</span></div>';
      }).join('') + '</div>';

    var wMiss = allMisses().filter(function(m){ return m.date >= ws && m.date <= we; });
    var missDays = [];
    rows.forEach(function(r){ for (var d = ws; d <= we; d = addDays(d, 1)) if (getStatus(d, r.b.id) === 'miss') missDays.push([d, r.b.id]); });
    var checkable = missDays.filter(function(x){ return addDays(x[0], 1) <= today; });
    var bounced = checkable.filter(function(x){ var n = getStatus(addDays(x[0], 1), x[1]); return n === 'min' || n === 'full'; }).length;
    var lines = [];
    if (!missDays.length) lines.push('No misses this week.');
    else {
      if (checkable.length) lines.push('After a miss, you voted the next day ' + bounced + ' of ' + checkable.length + ' times.');
      var trig = countBy(wMiss, function(m){ return m.feelings; });
      if (trig[0]) lines.push('Most common trigger this week: ' + trig[0][0].toLowerCase() + ' (' + trig[0][1] + ').');
    }
    html += '<p class="note">' + esc(lines.join(' ')) + '</p></section>';
  }

  var saved = S.docs.reviews.weeks[ws] || {};
  var d = S.drafts[ws] || saved;
  var hasDraft = !!S.drafts[ws];
  html += '<section class="card review-form"><div class="row-between"><div class="eyebrow">Weekly reflection</div>' +
    (saved.savedAt ? '<span class="note">Saved ' + esc(fmtShort(saved.savedAt)) + '</span>' : '') + '</div>' +
    '<div class="field"><label class="flabel" for="rv-well">What went well?</label><textarea id="rv-well" data-bind="rv.well" data-week="' + ws + '" rows="2" placeholder="Days you showed up, even with the minimum">' + esc(d.well) + '</textarea></div>' +
    '<div class="field"><label class="flabel" for="rv-block">What got in the way?</label><textarea id="rv-block" data-bind="rv.block" data-week="' + ws + '" rows="2" placeholder="Look at your misses. What keeps repeating?">' + esc(d.block) + '</textarea></div>' +
    '<div class="field"><label class="flabel" for="rv-change">One change for next week</label><textarea id="rv-change" data-bind="rv.change" data-week="' + ws + '" rows="2" placeholder="One concrete change. It shows on Today all next week.">' + esc(d.change) + '</textarea></div>' +
    '<div class="actions"><button class="btn primary" data-act="saveReview" data-week="' + ws + '" ' + (hasDraft ? '' : 'disabled') + '>Save review</button></div>' +
  '</section>';

  var weeks = Object.keys(S.docs.reviews.weeks).filter(function(k){ return k !== ws; }).sort().reverse();
  if (weeks.length){
    html += '<section class="card"><div class="eyebrow">Past reviews</div><div class="pastrev">' +
      weeks.slice(0, 12).map(function(k){
        var r = S.docs.reviews.weeks[k];
        return '<button data-act="week" data-week="' + k + '"><span class="mi-date">Week of ' + esc(fmtShort(k)) + '</span><span>' + esc(r.change ? 'Change: ' + r.change : (r.well || 'Review saved')) + '</span></button>';
      }).join('') + '</div></section>';
  }
  return html;
}

view.addEventListener('focusout', function(){

function burst(bid, kind){
  var btn = view.querySelector('.vote[data-bid="' + bid + '"][data-kind="' + kind + '"]');
  var card = btn && btn.closest('.trait');
  if (!card) return;
  btn.classList.add('pop');
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var br = btn.getBoundingClientRect(), cr = card.getBoundingClientRect();
  var b = document.createElement('div');
  b.className = 'burst';
  b.setAttribute('aria-hidden', 'true');
  b.style.left = (br.left - cr.left + br.width/2).toFixed(1) + 'px';
  b.style.top = (br.top - cr.top + br.height/2).toFixed(1) + 'px';
  var html = '';
  for (var i = 0; i < 16; i++){
    var ang = (Math.PI*2)*(i/16) + Math.random()*0.4, dist = 44 + Math.random()*44;
    html += '<i class="' + (i % 3 === 0 ? 'r' : '') + '" style="--k:' + CONFETTI[i % CONFETTI.length] + ';--dx:' + (Math.cos(ang)*dist).toFixed(1) + 'px;--dy:' + (Math.sin(ang)*dist - 12).toFixed(1) + 'px;--rot:' + Math.round(Math.random()*360) + 'deg"></i>';
  }
  html += '<span class="plus">' + (kind === 'min' ? '+1 · minimum counts' : '+1 vote') + '</span>';
  b.innerHTML = html;
  card.appendChild(b);
  setTimeout(function(){ if (b.parentNode) b.parentNode.removeChild(b); }, 1200);
}

function armed(el, label){

function saveMiss(){
  var m = sheetState.m, err = $('#missErr');
  if (!m.time && !m.feelings.length && !String(m.story).trim()){
    err.textContent = 'Pick when it slipped or what was going on, or write one line about it.';
    err.hidden = false; return;
  }
  m.place = String(m.place).trim();
  m.story = String(m.story).trim().replace(/^[“"]|[”"]$/g, '');
  m.ifThen.if = String(m.ifThen.if).trim().replace(/^if\s+/i, '').replace(/,$/, '');
  m.ifThen.then = String(m.ifThen.then).trim().replace(/^then\s+/i, '').replace(/\.$/, '');
  var now = new Date().toISOString();
  m.updatedAt = now; if (!m.createdAt) m.createdAt = now;
  var key = monthKey(m.date), md = month(key);
  var i = -1;
  md.misses.forEach(function(x, j){ if (x.id === m.id || (x.date === m.date && x.behaviorId === m.behaviorId)) i = j; });
  if (i >= 0) md.misses[i] = m; else md.misses.push(m);
  var d = md.days[m.date] || (md.days[m.date] = {});
  d[m.behaviorId] = 'miss';
  save(key);
  ensureCreated(m.behaviorId, m.date);
  closeSheet(); render();
  toast(m.ifThen.if && m.ifThen.then ? 'Miss logged, with a plan for next time' : 'Miss logged');
}
function removeMiss(el){

  var m = sheetState.m, key = monthKey(m.date), md = month(key);
  md.misses = md.misses.filter(function(x){ return !(x.id === m.id || (x.date === m.date && x.behaviorId === m.behaviorId)); });
  if (md.days[m.date] && md.days[m.date][m.behaviorId] === 'miss'){
    delete md.days[m.date][m.behaviorId];
    if (!Object.keys(md.days[m.date]).length) delete md.days[m.date];
  }
  save(key);
  closeSheet(); render(); toast('Miss removed');
}

function saveTrait(){
  var t = sheetState.t, isNew = sheetState.isNew, err = $('#traitErr');

  t.behaviors.forEach(function(b){ b.name = String(b.name).trim(); b.min = String(b.min).trim(); b.full = String(b.full).trim(); });
  var msg = '';
  if (!t.statement) msg = 'Finish the sentence “I am someone who…”.';
  else if (t.behaviors.some(function(b){ return !b.name || !b.min || !b.full; })) msg = 'Give each behavior a name, a minimum and a full version.';
  else if (isNew && activeTraits().length >= MAX_ACTIVE) msg = 'You already have 3 active identities. Archive one first.';
  if (msg){ err.textContent = msg; err.hidden = false; return; }
  var list = S.docs.traits.traits, i = -1;
  list.forEach(function(x, j){ if (x.id === t.id) i = j; });

  if (isNew && sheetState.fromNote) S.tab = 'identity';
  closeSheet(); render();

function archiveTrait(el){

function restoreTrait(id){

  traits().forEach(function(x){ if (x.id === id) x.archived = false; });
  save('traits'); render(); toast('Restored');
}

    case 'close': closeSheet(); break;
  }
});
document.addEventListener('input', function(e){
  var el = e.target, b = el.dataset && el.dataset.bind;
  if (!b) return;
  var v = el.value;
  if (b.indexOf('rv.') === 0){
    var ws = el.dataset.week, saved = S.docs.reviews.weeks[ws] || {};
    var d = S.drafts[ws] || (S.drafts[ws] = {well:saved.well || '', block:saved.block || '', change:saved.change || ''});
    d[b.slice(3)] = v;
    var btn = view.querySelector('[data-act="saveReview"]'); if (btn) btn.disabled = false;
    return;
  }
  if (b === 'note.new'){
    S.noteDraft = v; if (!S.demo) draftWriteSoon(v);
    var sb = view.querySelector('[data-act="saveNote"]'); if (sb) sb.disabled = !v.trim();
    return;
  }
  if (b === 'q.notes' || b === 'q.ideas'){
    if (b === 'q.notes') S.noteQuery = v; else S.ideaQuery = v;
    if (!searchRaf) searchRaf = requestAnimationFrame(function(){
      searchRaf = 0;
      var nl = $('#noteList'); if (nl) nl.innerHTML = renderNoteList();
      var il = $('#ideaList'); if (il) il.innerHTML = renderIdeaList();
    });
    return;
  }
  if (!sheetState) return;
  if (sheetState.type === 'miss'){
    var m = sheetState.m;
    if (b === 'm.place') m.place = v; else if (b === 'm.story') m.story = v;
    else if (b === 'm.if') m.ifThen.if = v; else if (b === 'm.then') m.ifThen.then = v;
  } else if (sheetState.type === 'trait'){
    var t = sheetState.t;
    if (b === 't.statement') t.statement = v;
    else if (b === 't.why') t.why = v;
    else { var p = b.split('.'); if (p[0] === 'b' && t.behaviors[+p[1]]) t.behaviors[+p[1]][p[2]] = v; }
  } else if (sheetState.type === 'note' && b === 'ne.text'){
    sheetState.n.text = v;
  } else if (sheetState.type === 'idea' && b.indexOf('i.') === 0){
    sheetState.x[b.slice(2)] = v;
  } else if (sheetState.type === 'settings' && b === 'restore'){
    sheetState.restore = v;
  }
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && !$('#sheetWrap').hidden) closeSheet();
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target && e.target.id === 'n-new'){ e.preventDefault(); saveNewNote(); }
});
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'hidden'){ flushAll(); return; }
  var t = todayStr();
  if (!sheetState && t !== S.renderedDay){
    if (S.day > t || S.day < addDays(t, -6)) S.day = t;
    requestRender();
  }
});
window.addEventListener('pagehide', flushAll);

/* ---------- boot ---------- */
var cached = lsRead();
if (cached) S.docs = normalize(cached);
S.noteDraft = draftRead();
view.addEventListener('animationend', function(e){ if (e.target === view) view.classList.remove('enter'); });
render();
connect();
setTimeout(function(){ S.skelExpired = true; if (S.skel) render(); }, 2500);
})();
</script>

</body></html>
